<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d9488">
    <meta name="description" content="登录 - MediData AI 医疗数据治理智能平台，输入账号密码进入工作台">
    <meta property="og:type" content="website">
    <meta property="og:title" content="登录 - MediData AI">
    <meta property="og:description" content="医疗数据治理智能平台登录入口">
    <title>登录 - MediData AI</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="components/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="components/common.css">
    <script src="components/common.js" defer></script>
    <style>
        /* 登录页专属：全屏 medical 背景，居中玻璃态卡片
         * body/html 撑满视口，径向光晕替代斜向 linear-gradient，
         * 消除上下/左右色差与底部露白 */
        html, body.login-bg {
            min-height: 100%;
            height: 100%;
        }
        html {
            background-color: #0d554f; /* 兜底：防止 body 短时露出 html 白底 */
        }
        .dark html {
            background-color: #032322;
        }
        .login-bg {
            background-color: #0d554f;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
        }
        .login-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(45, 212, 191, 0.18) 0, transparent 70%),
                radial-gradient(ellipse 100% 80% at 50% 100%, rgba(4, 47, 46, 0.5) 0, transparent 70%);
            pointer-events: none;
        }
        .dark .login-bg {
            background-color: #032322;
        }
        .dark .login-bg::before {
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(20, 184, 166, 0.12) 0, transparent 70%),
                radial-gradient(ellipse 100% 80% at 50% 100%, rgba(0, 0, 0, 0.4) 0, transparent 70%);
        }
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18), 0 8px 16px rgba(0, 0, 0, 0.08);
        }
        .dark .login-card {
            background: rgba(31, 41, 55, 0.92);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        /* 暗色切换按钮悬浮态 */
        .dark-toggle-login {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background-color 0.2s ease, color 0.2s ease;
            cursor: pointer;
        }
        .dark-toggle-login:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .dark-toggle-login:focus-visible {
            outline: 2px solid #14b8a6;
            outline-offset: 2px;
        }
        /* 密码可见性切换（flex 子项，不再用 absolute） */
        .pwd-toggle {
            color: var(--text-tertiary);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            min-width: 2.75rem;
            min-height: 2.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transition: color 0.2s ease, background-color 0.2s ease;
        }
        .pwd-toggle:hover { color: var(--text-primary); background: var(--bg-hover); }
        .pwd-toggle:focus-visible { outline: 2px solid var(--ring-color); outline-offset: 2px; }
    </style>
</head>
<body class="login-bg text-gray-800 dark:text-gray-200">
    <a href="#loginForm" class="skip-link">跳转到登录表单</a>

    <!-- 暗色模式切换（独立按钮，不依赖顶栏） -->
    <button type="button" class="dark-toggle-login" data-action="toggleDarkMode" aria-label="切换深色模式" title="切换深色模式">
        <i class="fas fa-moon dark-toggle-icon" aria-hidden="true"></i>
    </button>

    <!-- 登录卡片 -->
    <main class="flex items-center justify-center p-4 relative z-10" role="main" style="min-height:100vh">
        <div class="login-card w-full max-w-md rounded-2xl p-8 sm:p-10 flex flex-col">
            <!-- 品牌标识 -->
            <div class="text-center">
                <div class="w-16 h-16 bg-medical-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-medical-600/30">
                    <i class="fas fa-hospital-alt text-3xl text-white" aria-hidden="true"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">MediData AI</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">医疗数据治理智能平台</p>
            </div>

            <!-- 登录表单（占满卡片中部，输入框垂直居中） -->
            <form id="loginForm" class="flex-1 flex flex-col justify-center space-y-5 my-6" novalidate>
                <!-- 用户名 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        账号
                    </label>
                    <div class="flex items-center bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl form-control-focus transition-colors hover:border-gray-300 dark:hover:border-gray-600">
                        <i class="fas fa-user flex-shrink-0 w-12 text-center text-gray-400" aria-hidden="true"></i>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            autocomplete="username"
                            placeholder="请输入账号"
                            class="flex-1 min-w-0 py-2.5 pr-4 bg-transparent border-0 text-sm form-control-focus focus:outline-none"
                            aria-required="true"
                        >
                    </div>
                    <span class="field-error text-xs text-red-500 mt-1 hidden" id="username-error"></span>
                </div>

                <!-- 密码 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        密码
                    </label>
                    <div class="flex items-center bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl form-control-focus transition-colors hover:border-gray-300 dark:hover:border-gray-600">
                        <i class="fas fa-lock flex-shrink-0 w-12 text-center text-gray-400" aria-hidden="true"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="请输入密码"
                            class="flex-1 min-w-0 py-2.5 bg-transparent border-0 text-sm form-control-focus focus:outline-none"
                            aria-required="true"
                        >
                        <button type="button" class="pwd-toggle flex-shrink-0" data-action="togglePassword" aria-label="显示或隐藏密码">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="field-error text-xs text-red-500 mt-1 hidden" id="password-error"></span>
                </div>

                <!-- 记住我 + 忘记密码 -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-gray-300 text-medical-600 focus:ring-medical-400">
                        <span class="text-gray-600 dark:text-gray-400">记住我</span>
                    </label>
                    <a href="#" class="text-medical-600 hover:text-medical-700 font-medium" data-action="showToast" data-args="请联系管理员重置密码|info">忘记密码？</a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" id="loginBtn" class="w-full py-2.5 bg-medical-600 text-white rounded-xl text-sm font-semibold hover:bg-medical-700 transition-colors flex items-center justify-center gap-2 btn-transition shadow-md shadow-medical-600/20 focus-visible:ring-2 focus-visible:ring-medical-400 focus-visible:outline-none">
                    <span class="btn-text flex items-center gap-2">
                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i> 登 录
                    </span>
                </button>
            </form>

            <!-- 页脚 -->
            <p class="text-center text-xs text-gray-400 dark:text-gray-500 mt-8">
                © 2026 MediData AI · 医疗数据治理智能平台 v2.0
            </p>
        </div>
    </main>

    <script>
        // 暗色模式：独立按钮切换（登录页无顶栏，故单独走 toggle）
        if (window.MediData && MediData.registerAction) {
            MediData.registerAction('toggleDarkMode', function() {
                MediData.darkMode.toggle();
            });
        }

        // 密码可见性切换
        MediData.registerAction('togglePassword', function(el) {
            const input = document.getElementById('password');
            const icon = el.querySelector('i');
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
                el.setAttribute('aria-label', '隐藏密码');
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
                el.setAttribute('aria-label', '显示密码');
            }
        });

        // 表单提交校验 + 模拟登录
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const result = MediData.validateForm('loginForm', {
                username: [
                    MediData.validateRules.required,
                    MediData.validateRules.minLength(3),
                    MediData.validateRules.maxLength(32)
                ],
                password: [
                    MediData.validateRules.required,
                    MediData.validateRules.minLength(6),
                    MediData.validateRules.maxLength(64)
                ]
            });
            if (!result.valid) return;

            // 模拟登录：按钮 loading 态
            MediData.btnLoading.show('loginBtn', '登录中...');
            setTimeout(function() {
                MediData.btnLoading.hide('loginBtn');
                showToast('登录成功，正在进入工作台...', 'success');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 800);
            }, 900);
        });
    </script>
</body>
</html>
